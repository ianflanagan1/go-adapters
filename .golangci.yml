# Generated by go-baseline from go.mod. Don't edit: change the baseline, then
# run `go tool go-baseline write`.
# Module kind: adapters. Change it with `go tool go-baseline write -kind <kind>`.
version: "2"

run:
  # Lint the integration tests too.
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - errorlint
    - exhaustive
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - gocyclo
    - revive
    - testpackage
  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    exhaustive:
      default-signifies-exhaustive: false
    funlen:
      lines: 50
      statements: 30
    gochecksumtype:
      default-signifies-exhaustive: false
    gocognit:
      min-complexity: 10
    gocyclo:
      min-complexity: 8
    revive:
      enable-default-rules: true
      rules:
        - name: exported
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - forbidigo
          - funlen
          - gocognit
          - gocyclo

formatters:
  enable:
    - gofmt
    - goimports
