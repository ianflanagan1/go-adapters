# Generated by go-baseline from go.mod. Don't edit: change the baseline, then
# run `go tool go-baseline write`.
# Module kind: adapters. Change it with `go tool go-baseline write -kind <kind>`.
version: "2"

run:
  # Lint the integration tests too.
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - errorlint
    - exhaustive
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - gosec
    - modernize
    - revive
    - testpackage
    - wrapcheck
  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    exhaustive:
      default-signifies-exhaustive: false
    funlen:
      lines: 50
      statements: 30
    gochecksumtype:
      default-signifies-exhaustive: false
    gocognit:
      min-complexity: 10
    govet:
      enable:
        - nilness
    revive:
      enable-default-rules: true
      rules:
        - name: exported
    wrapcheck:
      # The module's own packages wrap their errors with context; wrap those
      # from other modules where they come in.
      ignore-package-globs:
        - github.com/ianflanagan1/go-adapters/*
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - forbidigo
          - funlen
          - gocognit
          - gosec
          - wrapcheck
      # Running commands and opening files by name is what adapters are for.
      - text: G204|G304
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
